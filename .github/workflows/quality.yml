name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Audit tool pages and public claims
        run: node scripts/site-audit.mjs
      - name: Build production pages
        run: npm run build
