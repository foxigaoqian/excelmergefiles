name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Type check
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E "error TS[0-9]+" typecheck.log | head -40 || tail -40 typecheck.log
            exit "$status"
          fi
          cat typecheck.log
      - name: Audit tool pages and public claims
        run: node scripts/site-audit.mjs
      - name: Build production pages
        run: npm run build
